case: "6.D.18"
summary: A supporter that isn't dislodged keeps its support, even when attacked from the province it aims at
position:
  units:
    - {power: russia, type: fleet, at: con}
    - {power: russia, type: fleet, at: bla}
    - {power: russia, type: army, at: bul}
    - {power: turkey, type: fleet, at: ank}
    - {power: turkey, type: army, at: smy}
    - {power: turkey, type: army, at: arm}
orders:
  - order: {type: support_move, power: russia, at: con, from: bla, to: ank}
    check: {legal: true}
    result: given
  - order: {type: move, power: russia, at: bla, destination: ank}
    check: {legal: true}
    result: succeeded
  - order: {type: support_hold, power: russia, at: bul, target: con}
    check: {legal: true}
    result: given
  - order: {type: move, power: turkey, at: ank, destination: con}
    check: {legal: true}
    result: bounced
    dislodged: true
  - order: {type: support_move, power: turkey, at: smy, from: ank, to: con}
    check: {legal: true}
    result: given
  - order: {type: move, power: turkey, at: arm, destination: ank}
    check: {legal: true}
    result: bounced
after:
  units:
    - {power: russia, type: fleet, at: con}
    - {power: russia, type: fleet, at: ank}
    - {power: russia, type: army, at: bul}
    - {power: turkey, type: army, at: smy}
    - {power: turkey, type: army, at: arm}
  dislodged:
    - {power: turkey, type: fleet, at: ank, from: bla}
