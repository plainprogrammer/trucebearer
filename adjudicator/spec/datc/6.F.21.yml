case: "6.F.21"
summary: A convoyed army cuts a support that is not part of a paradox
position:
  units:
    - {power: russia, type: army, at: edi}
    - {power: russia, type: fleet, at: nwg}
    - {power: russia, type: army, at: nwy}
    - {power: france, type: fleet, at: iri}
    - {power: france, type: fleet, at: mao}
    - {power: england, type: army, at: lvp}
    - {power: england, type: fleet, at: nao}
    - {power: england, type: fleet, at: cly}
orders:
  - order: {type: support_move, power: russia, at: edi, from: nwy, to: cly}
    check: {legal: true}
    result: given
  - order: {type: convoy, power: russia, at: nwg, from: nwy, to: cly}
    check: {legal: true}
    result: given
  - order: {type: move, power: russia, at: nwy, destination: cly}
    check: {legal: true}
    result: succeeded
  - order: {type: support_move, power: france, at: iri, from: mao, to: nao}
    check: {legal: true}
    result: given
  - order: {type: move, power: france, at: mao, destination: nao}
    check: {legal: true}
    result: succeeded
  - order: {type: move_via_convoy, power: england, at: lvp, to: cly}
    check: {legal: true}
    result: no_route
  - order: {type: convoy, power: england, at: nao, from: lvp, to: cly}
    check: {legal: true}
    result: disrupted
    dislodged: true
  - order: {type: support_hold, power: england, at: cly, target: nao}
    check: {legal: true}
    result: cut
    dislodged: true
after:
  units:
    - {power: russia, type: army, at: cly}
    - {power: russia, type: army, at: edi}
    - {power: france, type: fleet, at: iri}
    - {power: england, type: army, at: lvp}
    - {power: france, type: fleet, at: nao}
    - {power: russia, type: fleet, at: nwg}
  dislodged:
    - {power: england, type: fleet, at: cly, from: nwy, by_convoy: true}
    - {power: england, type: fleet, at: nao, from: mao}
