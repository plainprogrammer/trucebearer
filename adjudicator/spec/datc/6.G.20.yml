case: "6.G.20"
summary: A move via convoy to a neighbor whose convoy is disrupted does not fall back to land
position:
  units:
    - {power: france, type: fleet, at: bre}
    - {power: france, type: army, at: pic}
    - {power: france, type: army, at: bur}
    - {power: france, type: fleet, at: mao}
    - {power: england, type: fleet, at: eng}
orders:
  - order: {type: move, power: france, at: bre, destination: eng}
    check: {legal: true}
    result: succeeded
  - order: {type: move_via_convoy, power: france, at: pic, to: bel}
    check: {legal: true}
    result: no_route
  - order: {type: support_move, power: france, at: bur, from: pic, to: bel}
    check: {legal: true}
    result: given
  - order: {type: support_move, power: france, at: mao, from: bre, to: eng}
    check: {legal: true}
    result: given
  - order: {type: convoy, power: england, at: eng, from: pic, to: bel}
    check: {legal: true}
    result: disrupted
    dislodged: true
after:
  units:
    - {power: france, type: army, at: bur}
    - {power: france, type: fleet, at: eng}
    - {power: france, type: fleet, at: mao}
    - {power: france, type: army, at: pic}
  dislodged:
    - {power: england, type: fleet, at: eng, from: bre}
