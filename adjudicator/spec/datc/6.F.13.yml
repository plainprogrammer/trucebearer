case: "6.F.13"
summary: The other route carries the army even when its owner wanted the dislodged one
position:
  units:
    - {power: england, type: army, at: lon}
    - {power: england, type: fleet, at: nth}
    - {power: france, type: fleet, at: eng}
    - {power: germany, type: fleet, at: hol}
    - {power: germany, type: fleet, at: den}
orders:
  - order: {type: move, power: england, at: lon, destination: bel}
    check: {legal: true}
    result: succeeded
  - order: {type: convoy, power: england, at: nth, from: lon, to: bel}
    check: {legal: true}
    result: disrupted
    dislodged: true
  - order: {type: convoy, power: france, at: eng, from: lon, to: bel}
    check: {legal: true}
    result: given
  - order: {type: support_move, power: germany, at: hol, from: den, to: nth}
    check: {legal: true}
    result: given
  - order: {type: move, power: germany, at: den, destination: nth}
    check: {legal: true}
    result: succeeded
after:
  units:
    - {power: england, type: army, at: bel}
    - {power: france, type: fleet, at: eng}
    - {power: germany, type: fleet, at: hol}
    - {power: germany, type: fleet, at: nth}
  dislodged:
    - {power: england, type: fleet, at: nth, from: den}
