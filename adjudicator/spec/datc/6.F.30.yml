case: "6.F.30"
summary: A convoyed attack counts as coming from the army's own province
position:
  units:
    - {power: england, type: army, at: lon}
    - {power: england, type: fleet, at: eng}
    - {power: england, type: fleet, at: nth}
    - {power: france, type: fleet, at: bel}
    - {power: france, type: fleet, at: bre}
orders:
  - order: {type: move, power: england, at: lon, destination: bel}
    check: {legal: true}
    result: no_route
  - order: {type: convoy, power: england, at: eng, from: lon, to: bel}
    check: {legal: true}
    result: disrupted
    dislodged: true
  - order: {type: support_move, power: england, at: nth, from: lon, to: bel}
    check: {legal: true}
    result: given
  - order: {type: move, power: france, at: bel, destination: eng}
    check: {legal: true}
    result: succeeded
  - order: {type: support_move, power: france, at: bre, from: bel, to: eng}
    check: {legal: true}
    result: given
after:
  units:
    - {power: france, type: fleet, at: bre}
    - {power: france, type: fleet, at: eng}
    - {power: england, type: army, at: lon}
    - {power: england, type: fleet, at: nth}
  dislodged:
    - {power: england, type: fleet, at: eng, from: bel}
