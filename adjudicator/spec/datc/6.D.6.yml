    result: given
  - order: {type: support_hold, power: germany, at: pru, target: bal}
    check: {legal: true}
    result: given
  - order: {type: move, power: russia, at: lvn, destination: bal}
    check: {legal: true}
    result: bounced
  - order: {type: support_move, power: russia, at: bot, from: lvn, to: bal}
    check: {legal: true}
    result: given
after:
  units:
    - {power: germany, type: fleet, at: bal}
    - {power: russia, type: fleet, at: bot}
    - {power: russia, type: fleet, at: lvn}
    - {power: germany, type: fleet, at: pru}
    - {power: germany, type: army, at: swe}
