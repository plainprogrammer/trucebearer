    check: {legal: true}
  - order: {type: move, power: england, at: nao, destination: mao}
    check: {legal: true}
  - order: {type: support_hold, power: france, at: spa, target: mao}
    check: {legal: true}
  - order: {type: hold, power: france, at: mao}
    check: {legal: true}
  - order: {type: move, power: italy, at: gol, destination: "spa/sc"}
    check: {legal: true}
