case: "6.F.12"
summary: A dislodged fleet whose convoy order is illegal is on no route, so the convoy stands
position:
  units:
    - {power: england, type: fleet, at: eng}
    - {power: england, type: army, at: lon}
    - {power: england, type: fleet, at: iri}
    - {power: france, type: fleet, at: nao}
    - {power: france, type: fleet, at: mao}
orders:
  - order: {type: convoy, power: england, at: eng, from: lon, to: bel}
    check: {legal: true}
    result: given
  - order: {type: move, power: england, at: lon, destination: bel}
    check: {legal: true}
    result: succeeded
  - order: {type: convoy, power: england, at: iri, from: lon, to: bel}
    check: {legal: false, reason: not_on_chain}
    result: void
  - order: {type: support_move, power: france, at: nao, from: mao, to: iri}
    check: {legal: true}
    result: given
  - order: {type: move, power: france, at: mao, destination: iri}
    check: {legal: true}
    result: succeeded
after:
  units:
    - {power: england, type: army, at: bel}
    - {power: england, type: fleet, at: eng}
    - {power: france, type: fleet, at: iri}
    - {power: france, type: fleet, at: nao}
  dislodged:
    - {power: england, type: fleet, at: iri, from: mao}
