# Name of your application. Used to uniquely configure containers.
service: web

# Name of the container image (use your-user/app-name on external registries).
image: web

# This file is read through ERB with the environment of the machine that runs bin/kamal (Kamal does not load a .env file).
# Export TRUCEBEARER_HOST there before any bin/kamal command. web/README.md, "Self-hosting on a home lab", has the steps.

# Deploy to these servers: change the address to your VM's.
servers:
  web:
    - 192.168.0.1
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# A Cloudflare tunnel ends TLS and sends plain http to port 80 on the VM, so kamal-proxy does no SSL of its own.
# production.rb turns on config.assume_ssl and config.force_ssl to match, and leaves /up open to plain http for the health check.
# The host is the public name the tunnel serves, a bare host name such as play.example.org. The variable is required: bin/kamal
# fails without it. The same variable is passed to the container below, where production.rb allows only that host.
proxy:
  ssl: false
  host: "<%= ENV.fetch("TRUCEBEARER_HOST") %>"
  healthcheck:
    path: /up

# Where you keep your container images. For a localhost server Kamal runs a registry container on the deploy machine (so Docker
# must run there) and forwards its port to the VM over SSH, so no outside account or password is needed.
registry:
  # Alternatives: hub.docker.com / registry.digitalocean.com / ghcr.io / ...
  server: localhost:5555

  # Needed for authenticated registries.
  # username: your-user

  # Always use an access token rather than real password when possible.
  # password:
  #   - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - TRUCEBEARER_PASSPHRASE
  clear:
    # The public host name, the same value as proxy.host above. production.rb allows requests for this host only (and /up).
    TRUCEBEARER_HOST: "<%= ENV.fetch("TRUCEBEARER_HOST") %>"

    # Origins besides the app's own that may open the live-update socket, separated by commas or spaces.
    # Here it defaults to the host's own address; export TRUCEBEARER_CABLE_ORIGINS on the deploy machine to list others.
    # Unset in the app: only the address the app is served at; live updates stop working behind a proxy that changes the Host header.
    TRUCEBEARER_CABLE_ORIGINS: "<%= ENV.fetch("TRUCEBEARER_CABLE_ORIGINS") { "https://#{ENV.fetch("TRUCEBEARER_HOST")}" } %>"

    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # The table's time zone for step-in notices, a Rails zone name such as America/New_York (spec 026 D6). Unknown means UTC.
    TRUCEBEARER_TIME_ZONE: UTC

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use web-db for a db accessory server on same machine via local kamal docker network.
    # DB_HOST: 192.168.0.2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# The persistent volume for the four SQLite databases (app, cache, queue, cable), which database.yml keeps under storage/.
# Backups are the VM host's snapshots until 1.0, so make sure they cover the Docker volume web_storage.
volumes:
  - "web_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-4.0.10
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# Use accessory services (secrets come from .kamal/secrets).
# accessories:
#   db:
#     image: mysql:8.0
#     host: 192.168.0.2
#     # Change to 3306 to expose port to the world instead of just local network.
#     port: "127.0.0.1:3306:3306"
